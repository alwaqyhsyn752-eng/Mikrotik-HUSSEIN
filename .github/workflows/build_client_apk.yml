name: Build White-Label APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق'
        required: true
        default: 'HUSSEIN Net'
      primary_color:
        description: 'اللون الأساسي HEX بدون #'
        required: true
        default: '1A73E8'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.hussein.ghallab --project-name mikrotik_whitelabel .

      - name: Force Gradle 8.7
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' "$WRAPPER"
          cat "$WRAPPER"

      - name: Patch Gradle versions
        run: |
          python3 <<'PY'
          import re, os
          for path in ['android/settings.gradle', 'android/settings.gradle.kts']:
              if not os.path.exists(path): continue
              c = open(path).read()
              c = re.sub(r'(org\.jetbrains\.kotlin\.android["\)]\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>1.9.24\g<2>', c)
              c = re.sub(r'(com\.android\.application["\)]\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>8.1.0\g<2>', c)
              open(path, 'w').write(c)
              print('=== ' + path + ' ===')
              print(c)
          PY

      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hussein Ghallab,O=Hussein,C=YE"

      - name: Patch release signing
        run: |
          python3 <<'PY'
          import re, os
          for path in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if not os.path.exists(path): continue
              c = open(path).read()
              if 'signingConfig signingConfigs.debug' in c or 'getByName("debug")' in c:
                  continue
              if path.endswith('.kts'):
                  c = c.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("debug")\n        }', 1)
              else:
                  c = re.sub(r'buildTypes\s*\{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }', c, count=1)
              open(path, 'w').write(c)
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=APP_NAME="${{ github.event.inputs.app_name }}" \
            --dart-define=PRIMARY_COLOR="${{ github.event.inputs.primary_color }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.app_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
